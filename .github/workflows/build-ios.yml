name: Build iOS 16.2 Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        run: python -m pip install --upgrade pip && pip install -r desktop/requirements.txt

      - name: Run desktop unit tests
        run: python -m unittest discover -s desktop/tests -v

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid and dpkg via Homebrew
        run: |
          brew update
          brew install ldid dpkg

      - name: Build VCamSync.tipa, VCamHook.dylib and VCamTweak-rootless.deb
        run: |
          chmod +x ios/VCamSyncApp/build_ipa.sh
          bash ios/VCamSyncApp/build_ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcam-ios-16.2-artifacts
          path: |
            dist/VCamSync.tipa
            dist/VCamSync.ipa
            dist/VCamHook.dylib
            dist/VCamTweak-rootless.deb
          if-no-files-found: error

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VCamSync.tipa
            dist/VCamSync.ipa
            dist/VCamHook.dylib
            dist/VCamTweak-rootless.deb
